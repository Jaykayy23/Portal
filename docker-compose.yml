# One-command deployment. Put this behind a reverse proxy (Nginx, Caddy,
# Traefik) for TLS/HTTPS on a real domain — see README.md.

services:
  somoexpress:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in a .env file before running}
      - JWT_EXPIRES_IN=30d
      - SOMO_DB_PATH=/app/data/db.json
    volumes:
      - somoexpress-data:/app/data

volumes:
  somoexpress-data:
